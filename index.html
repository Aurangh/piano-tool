<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161c">
<meta name="apple-mobile-web-app-title" content="Piano Trainer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Piano Chord & Jazz Trainer</title>
<style>
:root{
  --bg:#14161c;--panel:#1d2029;--panel2:#262a35;--line:#3a3f4d;--text:#e8e9ee;--muted:#9aa0ad;
  --accent:#e0b25c;--accent2:#c9963d;--ok:#5cc98a;--bad:#e0656a;--hint:#4ab3e3;
  --kw:#f2efe8;--kb:#1b1b20;--r:12px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;padding:var(--sat) var(--sar) 0 var(--sal);user-select:none;-webkit-user-select:none}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
header h1{font-size:15px;margin:0 6px 0 2px;color:var(--accent);white-space:nowrap;font-weight:650;letter-spacing:.2px}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
nav::-webkit-scrollbar{display:none}
nav button{flex:none}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-height:44px;min-width:44px;padding:0 14px;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(1px)}
button.on,nav button.on{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button.ok{background:var(--ok);color:#06210f;border-color:var(--ok)}
button.bad{background:var(--bad);color:#2a0607;border-color:var(--bad)}
button:disabled{opacity:.35}
main{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line);min-height:40px;padding:0 12px;background:var(--panel2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#1a1405;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.staffbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:4px;display:flex;justify-content:center;margin-bottom:10px;transition:box-shadow .15s}
.staffbox svg{width:100%;max-width:560px;height:auto;max-height:32vh}
.staffbox.flash-ok{box-shadow:0 0 0 3px var(--ok) inset}
.staffbox.flash-bad{box-shadow:0 0 0 3px var(--bad) inset}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;min-height:24px}
.feedback{font-weight:600;min-height:22px}
.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}
.answers{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.answers button{padding:0;font-size:18px;font-weight:600}
.answers.keys15{grid-template-columns:repeat(5,1fr)}
.answers.keys15 button{font-size:16px}
.accrow{display:flex;gap:6px;justify-content:center;margin-top:6px}
.accrow button{width:64px;font-size:20px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line);border-radius:30px;transition:.15s}
.sw span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:var(--muted);border-radius:50%;transition:.15s}
.sw input:checked+span{background:var(--accent2);border-color:var(--accent)}
.sw input:checked+span:before{transform:translateX(22px);background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:38px;font-size:14px}
.aidbar{display:flex;gap:6px;flex-wrap:wrap}
.aidbar button{min-height:36px;font-size:13px;padding:0 10px}
.names{font-size:20px;font-weight:600;text-align:center;min-height:30px;letter-spacing:.5px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
.bar{height:8px;background:var(--panel2);border-radius:8px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.ksgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.ksgrid div{background:var(--panel2);border-radius:8px;padding:6px;text-align:center;font-size:13px}
textarea{width:100%;min-height:90px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;font:12px/1.3 ui-monospace,monospace;padding:8px;user-select:text;-webkit-user-select:text}
input[type=range]{width:100%;accent-color:var(--accent)}
.twocol{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:900px){.twocol{grid-template-columns:1fr 1fr}}
/* keyboard */
#kbdPanel{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--sab))}
#kbdPanel.hidden{display:none}
#kbdPanel.compact #kbd{height:clamp(70px,12vh,110px)}
#kbdPanel.compact .kbdbar{margin-bottom:3px}
#kbdPanel.compact .kbdbar button{min-height:30px}
.kbdbar{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.kbdbar button{min-height:36px;padding:0 12px}
#kbd{position:relative;height:clamp(96px,22vh,190px);touch-action:none;border-radius:6px;overflow:hidden;background:#000}
.key{position:absolute;top:0;touch-action:none}
.key.w{height:100%;background:var(--kw);border-right:1px solid #9a968d;border-radius:0 0 5px 5px;z-index:1}
.key.b{height:62%;background:var(--kb);border:1px solid #000;border-top:0;border-radius:0 0 4px 4px;z-index:2;box-shadow:inset 0 -4px 0 #34343c}
.key .lab{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11px;color:#555;font-weight:600;pointer-events:none}
.key.b .lab{color:#bbb;bottom:4px;font-size:9px}
.key .strip{position:absolute;left:3px;right:3px;bottom:22px;height:5px;border-radius:3px;pointer-events:none}
.key.w.press{background:#d9c69c}.key.b.press{background:#5a4a2a}
.key.w.hint{background:#a8d9f0}.key.b.hint{background:#1d6f96}
.key.w.okk{background:#a6e6c1}.key.b.okk{background:#23824c}
.key.w.badk{background:#f0b0b2}.key.b.badk{background:#9a2c30}
.key.w.show{background:#f0dba8}.key.b.show{background:#8c6a24}
.notice{background:#2b2618;border:1px solid #5a4a22;color:#f1dfae;border-radius:10px;padding:10px;font-size:14px;margin-bottom:12px}
.circle svg{width:100%;max-width:420px;display:block;margin:0 auto}
.circle text{user-select:none}
.big{font-size:26px;font-weight:700}
/* full view */
#fsBtn{flex:none}
#focusBar{position:fixed;top:calc(6px + var(--sat));right:calc(6px + var(--sar));z-index:50;display:none;gap:6px}
#focusBar button{min-height:40px;background:rgba(29,32,41,.92)}
#focusTools{display:flex;gap:6px}
body.focus #focusBar{display:flex}
body.focus header{display:none}
body.focus .nofocus{display:none!important}
body.focus main{display:flex;flex-direction:column;padding:6px 6px 0;overflow:hidden}
body.focus .staffbox{flex:1;min-height:0;margin-bottom:6px;align-items:center}
body.focus .staffbox svg{max-height:100%;height:100%;max-width:none}
body.focus #kbd{height:clamp(100px,38vh,360px)}
body.focus #kbdPanel.compact #kbd{height:clamp(70px,16vh,130px)}
body.focus .hud{padding-right:120px}
/* songs */
.songlist button.song{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:10px 12px;margin-bottom:6px;min-height:56px}
.songlist .meta{color:var(--muted);font-size:12px}
.score{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:4px 0;color:var(--text)}
.score svg{display:block;width:100%;height:auto}
.score .cur .hd,.score .cur .st{fill:var(--accent)!important;stroke:var(--accent)!important}
.score .cur .rs{stroke:var(--accent)!important;fill:var(--accent)!important}
.score .done{opacity:.5}
body.focus .score{flex:1;min-height:0;overflow-y:auto}
pre.fmt{white-space:pre-wrap;font:12px/1.45 ui-monospace,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;margin:8px 0;user-select:text;-webkit-user-select:text}
#updBanner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--sab));z-index:60;display:none;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--accent);border-radius:12px;padding:8px 8px 8px 14px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#updBanner.show{display:flex}
#toast{position:fixed;left:50%;top:calc(70px + var(--sat));transform:translateX(-50%);z-index:70;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font:12px ui-monospace,monospace}
.rootgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rootgrid button{padding:0;font-weight:600;font-size:15px}
@media (min-width:760px){.rootgrid{grid-template-columns:repeat(12,1fr)}}
</style>
</head>
<body>
<header>
  <h1>𝅘𝅥 Piano Trainer</h1>
  <nav id="nav">
    <button data-v="play">Play</button>
    <button data-v="read">Read</button>
    <button data-v="chords">Chords</button>
    <button data-v="keys">Key sigs</button>
    <button data-v="songs">Songs</button>
    <button data-v="progress">Progress</button>
    <button data-v="settings" aria-label="Settings">⚙</button>
  </nav>
  <button id="fsBtn" aria-label="Full view" title="Full view (keys + notes only)">⛶</button>
</header>
<main id="main"></main>
<div id="updBanner"><span>New version ready</span><button id="updBtn" class="on">Reload</button></div>
<div id="toast"></div>
<div id="focusBar"><span id="focusTools"></span><button id="focusExit" aria-label="Exit full view">✕</button></div>
<div id="kbdPanel">
  <div class="kbdbar">
    <button id="kbLeft" aria-label="Lower octave">◀</button>
    <span id="kbRange" class="muted small"></span>
    <button id="kbRight" aria-label="Higher octave">▶</button>
  </div>
  <div id="kbd"></div>
</div>
<script>
'use strict';
/* ================= Music core ================= */
const LETTERS=['C','D','E','F','G','A','B'];
const LETTER_PC=[0,2,4,5,7,9,11];
const ACC={'-2':'𝄫','-1':'♭','0':'','1':'♯','2':'𝄪'};
const NOTE_COLORS=['#e5534b','#e8913c','#e3c94a','#5cc98a','#4ab3e3','#7f86ee','#c27be6'];
const N=(l,a,oct,clef)=>({l,a,oct,clef});
const li=n=>LETTERS.indexOf(n.l);
const midiOf=n=>12*(n.oct+1)+LETTER_PC[li(n)]+n.a;
const dia=n=>n.oct*7+li(n);
const nameOf=(n,o=true)=>n.l+ACC[n.a]+(o?n.oct:'');
const isBlack=m=>[1,3,6,8,10].includes(((m%12)+12)%12);
const SHARP_SP=[['C',0],['C',1],['D',0],['D',1],['E',0],['F',0],['F',1],['G',0],['G',1],['A',0],['A',1],['B',0]];
const FLAT_SP=[['C',0],['D',-1],['D',0],['E',-1],['E',0],['F',0],['G',-1],['G',0],['A',-1],['A',0],['B',-1],['B',0]];
function spellMidi(m,pref){const [l,a]=(pref==='flat'?FLAT_SP:SHARP_SP)[m%12];return N(l,a,Math.floor(m/12)-1);}
function parseName(s){const m=/^([A-G])([#b♯♭]?)(-?\d)$/.exec(s);return N(m[1],{'#':1,'♯':1,'b':-1,'♭':-1}[m[2]]||0,+m[3]);}
function diaRange(from,to,clef){const a=dia(parseName(from)),b=dia(parseName(to)),out=[];for(let d=a;d<=b;d++)out.push(N(LETTERS[d%7],0,Math.floor(d/7),clef));return out;}

/* ================= Storage ================= */
const APP_VERSION='0.4.0';
const STORE='pianoTrainer.v1';
const DEFAULTS={
  settings:{aidLetters:false,aidKeyLight:false,aidColors:false,symStyle:'std',keyLabels:'c',spelling:'sharp',volume:0.7,kbSize:'auto'},
  read:{level:1,mode:'names',exactOct:false,noKeys:false},
  song:{id:null,mode:'listen',tempo:1,chords:true,noKeys:false,exact:false,loop:false},
  customSongs:[],
  ks:{level:1,ask:'major',view:'quiz'},
  stats:{read:{},notes:{},ks:{},songs:{},log:[]},
  view:'play'
};
function merge(base,over){for(const k in over){if(over[k]&&typeof over[k]==='object'&&!Array.isArray(over[k])&&base[k]&&typeof base[k]==='object')merge(base[k],over[k]);else base[k]=over[k];}return base;}
const clone=o=>JSON.parse(JSON.stringify(o));
let S=(()=>{try{const r=localStorage.getItem(STORE);if(r)return merge(clone(DEFAULTS),JSON.parse(r));}catch(e){}return clone(DEFAULTS);})();
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{const j=JSON.stringify(S);try{localStorage.setItem(STORE,j);}catch(e){}IDB.set('state',JSON.parse(j));},150);}
/* IndexedDB: primary store in the installed app; localStorage stays as a fallback */
const IDB={db:null,ok:false,
  open(){return new Promise((res,rej)=>{try{if(!window.indexedDB)return rej('none');const r=indexedDB.open('piano-trainer',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;this.ok=true;res();};r.onerror=()=>rej(r.error);}catch(e){rej(e);}});},
  get(k){return new Promise(res=>{try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined);}catch(e){res(undefined);}});},
  set(k,v){if(!this.ok)return;try{this.db.transaction('kv','readwrite').objectStore('kv').put(v,k);}catch(e){}}};
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1400);}
function downloadFile(name,text,type){try{const b=new Blob([text],{type:type||'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);return true;}catch(e){return false;}}
function pickFiles(accept,multiple){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=accept;i.multiple=!!multiple;
  i.onchange=async()=>{const out=[];for(const f of i.files)out.push({name:f.name,text:await f.text()});res(out);};i.click();});}

/* ================= Audio ================= */
let actx=null,master=null;const voices=new Map();
function ensureAudio(){
  if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;actx=new AC();
    const comp=actx.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;
    master=actx.createGain();master.gain.value=S.settings.volume;master.connect(comp);comp.connect(actx.destination);}
  if(actx.state==='suspended')actx.resume().catch(()=>{});
}
function noteOn(m,vel=0.85){
  ensureAudio();if(!actx)return;killVoice(m,0.02);
  const t=actx.currentTime,f=440*Math.pow(2,(m-69)/12);
  const g=actx.createGain(),flt=actx.createBiquadFilter();flt.type='lowpass';
  flt.frequency.setValueAtTime(Math.min(10000,f*9),t);flt.frequency.exponentialRampToValueAtTime(Math.max(500,f*2.2),t+1.6);
  const len=Math.max(1.6,4.5-(m-48)*0.05);const oscs=[];
  [['triangle',1,1],['sine',2,0.32],['sine',3,0.12],['sine',4.02,0.05]].forEach(([type,mul,amp])=>{
    const o=actx.createOscillator();o.type=type;o.frequency.value=f*mul;const og=actx.createGain();og.gain.value=amp;
    o.connect(og);og.connect(flt);o.start(t);o.stop(t+len+0.1);oscs.push(o);});
  flt.connect(g);g.connect(master);const pk=0.26*vel;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+0.006);
  g.gain.exponentialRampToValueAtTime(pk*0.3,t+0.45);g.gain.exponentialRampToValueAtTime(0.0001,t+len);
  voices.set(m,{g,oscs});
}
function killVoice(m,r){const v=voices.get(m);if(!v||!actx)return;voices.delete(m);const t=actx.currentTime;
  try{v.g.gain.cancelScheduledValues(t);v.g.gain.setValueAtTime(Math.max(v.g.gain.value,0.0001),t);v.g.gain.exponentialRampToValueAtTime(0.0001,t+r);}catch(e){}
  v.oscs.forEach(o=>{try{o.stop(t+r+0.05);}catch(e){}});}
const noteOff=m=>killVoice(m,0.28);
function playNotes(ms,dur=1.3,arp=0){ms.forEach((m,i)=>setTimeout(()=>{noteOn(m);setTimeout(()=>noteOff(m),dur*1000);},i*arp));}

/* ================= Staff renderer (SVG) ================= */
const SP=10; // staff space
function staffLayout(clefs){
  if(clefs==='treble')return{W:320,H:150,T:{top:45,bot:85}};
  if(clefs==='bass')return{W:320,H:150,B:{top:45,bot:85}};
  return{W:320,H:215,T:{top:40,bot:80},B:{top:135,bot:175}};
}
function yOf(d,clef,L){return clef==='treble'?L.T.bot-(d-30)*SP/2:L.B.bot-(d-18)*SP/2;}
function clefOfNote(n,clefs){if(clefs==='treble'||clefs==='bass')return clefs;return n.clef||(midiOf(n)>=60?'treble':'bass');}
const SIG_POS={sharp:{treble:[38,35,39,36,33,37,34],bass:[24,21,25,22,19,23,20]},flat:{treble:[34,37,33,36,32,35,31],bass:[20,23,19,22,18,21,17]}};
function accGlyph(a,x,y,cls=''){
  const s=ACC[a]||'♮';const dy=a<0?-3:1;
  return `<text x="${x}" y="${y+dy}" font-size="21" text-anchor="middle" dominant-baseline="central" fill="currentColor" class="${cls}" font-family="'Segoe UI Symbol','Apple Symbols','Noto Sans Symbols 2','DejaVu Sans',serif">${s}</text>`;
}
function trebleClef(L){const B=L.T.bot,T=L.T.top,G=B-SP;
  return `<g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round">
  <path d="M27 ${G+2} C27 ${G-5},17 ${G-5},17 ${G+1} C17 ${G+9},32 ${G+9},32 ${G-1} C32 ${G-11},21 ${G-17},22 ${T-4} C22.5 ${T-14},30 ${T-13},28.5 ${T-3} L22 ${B+13} C21 ${B+19},14 ${B+19},15 ${B+13}"/></g>
  <circle cx="16.5" cy="${B+13}" r="2.6" fill="currentColor"/>`;}
function bassClef(L){const F=L.B.top+SP;
  return `<circle cx="17" cy="${F}" r="3.6" fill="currentColor"/>
  <path d="M15 ${F-1} C15 ${F-11},35 ${F-12},34 ${F+2} C33 ${F+14},24 ${F+21},14 ${F+27}" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="40" cy="${F-5}" r="2" fill="currentColor"/><circle cx="40" cy="${F+5}" r="2" fill="currentColor"/>`;}
/* opts: {clefs, notes:[{n, cls, color}], sig:{count,type}, letters:bool, colors:bool} */
function renderStaff(opts){
  const clefs=opts.clefs||'grand',L=staffLayout(clefs);const out=[];
  out.push(`<svg viewBox="0 0 ${L.W} ${L.H}" xmlns="http://www.w3.org/2000/svg" style="color:var(--text)" role="img" aria-label="Music staff">`);
  const staffs=[];if(L.T)staffs.push(['treble',L.T]);if(L.B)staffs.push(['bass',L.B]);
  staffs.forEach(([c,st])=>{for(let i=0;i<5;i++){const y=st.top+i*SP;out.push(`<line x1="8" x2="${L.W-8}" y1="${y}" y2="${y}" stroke="#8b90a0" stroke-width="1"/>`);}
    out.push(`<line x1="8" x2="8" y1="${st.top}" y2="${st.bot}" stroke="#8b90a0"/><line x1="${L.W-8}" x2="${L.W-8}" y1="${st.top}" y2="${st.bot}" stroke="#8b90a0"/>`);
    out.push(c==='treble'?trebleClef(L):bassClef(L));});
  if(L.T&&L.B){out.push(`<line x1="8" x2="8" y1="${L.T.top}" y2="${L.B.bot}" stroke="#8b90a0" stroke-width="1.5"/>`);
    out.push(`<path d="M4 ${L.T.top} Q-2 ${(L.T.top+L.B.bot)/2-20},4 ${(L.T.top+L.B.bot)/2} Q-2 ${(L.T.top+L.B.bot)/2+20},4 ${L.B.bot}" fill="none" stroke="#8b90a0" stroke-width="2"/>`);}
  let x0=52;
  if(opts.sig&&opts.sig.count){const pos=SIG_POS[opts.sig.type];
    staffs.forEach(([c])=>{for(let i=0;i<opts.sig.count;i++)out.push(accGlyph(opts.sig.type==='sharp'?1:-1,x0+i*10,yOf(pos[c][i],c,L)));});
    x0+=opts.sig.count*10+8;}
  const notes=(opts.notes||[]).map(o=>({...o,clef:clefOfNote(o.n,clefs),d:dia(o.n)}));
  const cx=opts.x||Math.max(x0+40,(x0+L.W)/2);
  // second-interval offsets per clef
  const byClef={treble:[],bass:[]};notes.forEach(o=>byClef[o.clef].push(o));
  Object.values(byClef).forEach(arr=>{arr.sort((a,b)=>a.d-b.d);let prev=null;arr.forEach(o=>{o.dx=0;if(prev&&o.d-prev.d<=1&&!prev.dx)o.dx=13;prev=o;});});
  Object.values(byClef).forEach(arr=>{const cols=[];arr.filter(o=>o.n.a).sort((a,b)=>b.d-a.d).forEach(o=>{let c=0;while(cols[c]&&cols[c].some(dd=>Math.abs(dd-o.d)<6))c++;(cols[c]=cols[c]||[]).push(o.d);o.ac=c;});});
  notes.forEach(o=>{const y=yOf(o.d,o.clef,L),x=cx+o.dx;const st=o.clef==='treble'?L.T:L.B;const base=o.clef==='treble'?30:18;
    // ledger lines
    const top=base+8;const lines=[];
    if(o.d<base){for(let d=base-2;d>=o.d;d-=2)lines.push(d);}
    if(o.d>top){for(let d=top+2;d<=o.d;d+=2)lines.push(d);}
    lines.forEach(d=>{const ly=yOf(d,o.clef,L);out.push(`<line x1="${x-12}" x2="${x+12}" y1="${ly}" y2="${ly}" stroke="#c7cad3" stroke-width="1.3"/>`);});
    const col=o.color||(opts.colors?NOTE_COLORS[li(o.n)]:'currentColor');
    if(o.n.a)out.push(accGlyph(o.n.a,cx-17-(o.ac||0)*11,y));
    out.push(`<ellipse cx="${x}" cy="${y}" rx="6.6" ry="4.7" transform="rotate(-20 ${x} ${y})" fill="${col}" class="${o.cls||''}"/>`);
    if(opts.letters)out.push(`<text x="${x+12+(o.dx?2:0)}" y="${y}" font-size="11" dominant-baseline="central" fill="var(--accent)" font-weight="700">${nameOf(o.n,false)}</text>`);
  });
  out.push('</svg>');return out.join('');
}

/* ================= Keyboard ================= */
const KB={start:48,whites:15,keys:[],lit:new Map(),held:new Set(),onPress:null,onRelease:null};
function kbWhiteCount(w){const s=S.settings.kbSize;const per=s==='large'?56:s==='small'?34:(w<520?40:w<900?46:44);return Math.max(7,Math.min(36,Math.floor(w/per)));}
function buildKeyboard(){
  const el=document.getElementById('kbd');const w=el.clientWidth||360;KB.whites=kbWhiteCount(w);
  while(isBlack(KB.start))KB.start--;
  const whites=[];let m=KB.start;while(whites.length<KB.whites){if(!isBlack(m))whites.push(m);m++;}
  KB.lo=whites[0];KB.hi=whites[whites.length-1];
  const ww=100/KB.whites,bw=ww*0.6;const html=[];
  whites.forEach((wm,i)=>{const n=spellMidi(wm,'sharp');let lab='';
    if(S.settings.keyLabels==='all')lab=nameOf(n,n.l==='C');else if(S.settings.keyLabels==='c'&&n.l==='C')lab=nameOf(n);
    const strip=S.settings.aidColors?`<span class="strip" style="background:${NOTE_COLORS[li(n)]}"></span>`:'';
    html.push(`<div class="key w" data-m="${wm}" style="left:${i*ww}%;width:${ww}%">${strip}<span class="lab">${lab}</span></div>`);
    if(i<whites.length-1&&isBlack(wm+1))html.push(`<div class="key b" data-m="${wm+1}" style="left:${(i+1)*ww-bw/2}%;width:${bw}%"></div>`);});
  el.innerHTML=html.join('');KB.keys=[...el.querySelectorAll('.key')];
  document.getElementById('kbRange').textContent=nameOf(spellMidi(KB.lo,'sharp'))+' – '+nameOf(spellMidi(KB.hi,'sharp'));
  paintKeys();
}
function paintKeys(){KB.keys.forEach(k=>{const m=+k.dataset.m;k.classList.remove('press','hint','okk','badk','show');
  if(KB.held.has(m))k.classList.add('press');else if(KB.lit.has(m))k.classList.add(KB.lit.get(m));});}
function kbCompact(on){document.getElementById('kbdPanel').classList.toggle('compact',!!on);setTimeout(buildKeyboard,0);}
function lightKeys(map){KB.lit=new Map(map);paintKeys();}
function ensureVisible(m){if(m<KB.lo||m>KB.hi){KB.start=Math.max(21,m-((m%12))-(KB.whites>=14?12:0));if(m-KB.start<0)KB.start=m;buildKeyboard();}}
(function initKeyboard(){
  const el=document.getElementById('kbd');const ptrs=new Map();
  const press=m=>{KB.held.add(m);noteOn(m);paintKeys();KB.onPress&&KB.onPress(m);};
  const release=m=>{if(m==null)return;if([...ptrs.values()].filter(v=>v===m).length>1)return;KB.held.delete(m);noteOff(m);paintKeys();KB.onRelease&&KB.onRelease(m);};
  KB.press=press;KB.release=m=>{KB.held.delete(m);noteOff(m);paintKeys();KB.onRelease&&KB.onRelease(m);};
  const keyAt=(x,y)=>{const t=document.elementFromPoint(x,y);const k=t&&t.closest&&t.closest('.key');return k&&el.contains(k)?+k.dataset.m:null;};
  el.addEventListener('pointerdown',e=>{const k=e.target.closest('.key');if(!k)return;e.preventDefault();try{e.target.releasePointerCapture(e.pointerId);}catch(_){}
    const m=+k.dataset.m;ptrs.set(e.pointerId,m);press(m);});
  el.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const m=keyAt(e.clientX,e.clientY),old=ptrs.get(e.pointerId);
    if(m!==old){ptrs.set(e.pointerId,m);release(old);if(m!=null)press(m);}});
  const up=e=>{if(!ptrs.has(e.pointerId))return;const m=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);release(m);};
  window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  el.addEventListener('contextmenu',e=>e.preventDefault());
  document.getElementById('kbLeft').onclick=()=>{KB.start=Math.max(21,KB.start-12);buildKeyboard();};
  document.getElementById('kbRight').onclick=()=>{KB.start=Math.min(96,KB.start+12);buildKeyboard();};
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(buildKeyboard,120);});
})();

      :rec&&rec.interval?`<span class="muted">${rec.interval}</span>`:rec&&rec.unknown?'<span class="muted small">No chord name in the current library</span>':'';
    document.getElementById('pStaff').innerHTML=renderStaff({clefs:'grand',notes:ns.map(n=>({n,cls:''})),letters:S.settings.aidLetters,colors:S.settings.aidColors});
    if(ns.length)document.getElementById('pNames').innerHTML=ns.map(n=>`<span style="${S.settings.aidColors?'color:'+NOTE_COLORS[li(n)]:''}">${nameOf(n)}</span>`).join(' · ');

  KB.onPress=()=>{if(KB.held.size===1)ghost=[];ghost=[...new Set([...ghost,...KB.held])];draw();};
  KB.onRelease=()=>draw();
  draw();
}
const AID_LABEL={aidLetters:'Letters on staff',aidKeyLight:'Light the key',aidColors:'Note colours'};
function renderAidBar(el,list,onChange){el.innerHTML=list.map(k=>`<button data-a="${k}" class="${S.settings[k]?'on':''}">${AID_LABEL[k]}</button>`).join('');

/* ---------- READ (note reading trainer) ---------- */
const TREB=()=>diaRange('D4','G5','treble'),BASS=()=>diaRange('F2','B3','bass');
function withAccidentals(pool){const out=[];pool.forEach(n=>{out.push(n);
  if(!['E','B'].includes(n.l))out.push(N(n.l,1,n.oct,n.clef));if(!['F','C'].includes(n.l))out.push(N(n.l,-1,n.oct,n.clef));});return out;}
const LEVELS=[
  {id:1,name:'Landmarks',clefs:'grand',tip:'Anchor notes: Middle C sits on a ledger line between the staves. Treble G is the line the treble clef curls around; Bass F is the line between the bass clef dots. High C and low C are 2 spaces/lines further out.',
   pool:()=>[N('C',0,4,'treble'),N('C',0,4,'bass'),N('G',0,4,'treble'),N('F',0,3,'bass'),N('C',0,5,'treble'),N('C',0,3,'bass')]},
  {id:2,name:'Treble staff',clefs:'treble',tip:'Lines bottom→top: E G B D F. Spaces: F A C E. Count up or down from a landmark (G line, high C).',pool:TREB},
  {id:3,name:'Bass staff',clefs:'bass',tip:'Lines bottom→top: G B D F A. Spaces: A C E G. Count from Bass F (the line between the dots).',pool:BASS},
  {id:4,name:'Grand staff',clefs:'grand',tip:'Both staves mixed. Check the clef first, then find the nearest landmark.',pool:()=>[...TREB(),...BASS()]},
  {id:5,name:'Ledger lines',clefs:'grand',tip:'Each ledger line continues the line–space pattern. Middle C is one ledger below the treble staff and one above the bass staff.',
   pool:()=>[...diaRange('A3','C4','treble'),...diaRange('A5','C6','treble'),...diaRange('C2','E2','bass'),...diaRange('C4','E4','bass'),...TREB().filter((_,i)=>i%3===0),...BASS().filter((_,i)=>i%3===0)]},
  {id:6,name:'Accidentals',clefs:'grand',tip:'♯ raises a note by a half step (next key to the right), ♭ lowers it (next key to the left). Name the line or space first, then add the accidental.',pool:()=>withAccidentals([...TREB(),...BASS()])},
];
const noteKey=n=>n.clef+':'+nameOf(n);
function aided(){return S.settings.aidLetters||S.settings.aidKeyLight||S.settings.aidColors;}
function pickNote(pool,prev){
  const ws=pool.map(n=>{const st=S.stats.notes[noteKey(n)]||{a:0,c:0};const acc=(st.c+1)/(st.a+2);return 1+4*(1-acc)+(st.a<2?1.5:0);});
  for(let tries=0;tries<8;tries++){let r=Math.random()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0){const n=pool[i];if(!prev||noteKey(n)!==noteKey(prev)||pool.length<3)return n;break;}}}
  return pool[Math.floor(Math.random()*pool.length)];
}
function recordNote(n,score,ms){
  const k=noteKey(n);const st=S.stats.notes[k]||(S.stats.notes[k]={a:0,c:0,t:0});st.a++;st.c+=score;st.t=st.t?Math.round(st.t*0.7+ms*0.3):ms;
  const lv=S.stats.read[S.read.level]||(S.stats.read[S.read.level]={ua:0,uc:0,aa:0,ac:0});
  if(aided()||hintUsed){lv.aa++;lv.ac+=score;}else{lv.ua++;lv.uc+=score;}
  S.stats.log.push({d:Date.now(),k:'read',lv:S.read.level,s:score,aid:aided()||hintUsed?1:0});if(S.stats.log.length>3000)S.stats.log.splice(0,500);
  save();
}
let hintUsed=false;
function viewRead(){
  const R=S.read;if(R.noKeys&&R.mode==='keys')R.mode='names';let cur=null,prev=null,t0=0,locked=false,acc=0,sess={a:0,c:0,streak:0,time:0},timer=null;
  main.innerHTML=`
  <div class="chips nofocus" id="rLevels"></div>
  <div class="hud" style="margin-top:8px"><span class="feedback" id="rFb"></span><span class="muted small" id="rHud"></span></div>
  <div class="staffbox" id="rStaff"></div>
  <div id="rAnswer"></div>
  <div class="card nofocus" style="margin-top:12px">
    <div class="row" style="justify-content:space-between;gap:10px">
      <div class="seg" id="rMode"><button data-m="names">Names</button><button data-m="keys">Keys</button><button data-m="self">My piano</button></div>
      <button id="rHint" class="ghost">Hint</button>
    </div>
    <div class="aidbar" id="rAids" style="margin-top:8px"></div>
    <div class="toggle" style="margin-top:4px"><div><div class="small">On-screen keyboard</div><div class="muted small">Turn off to practise reading only — answer by name or on your own piano.</div></div><label class="sw"><input type="checkbox" id="rKb"><span></span></label></div>
    <div class="toggle" id="rOctRow"><span class="small">Exact octave (Keys mode)</span><label class="sw"><input type="checkbox" id="rOct"><span></span></label></div>
    <p class="muted small" id="rTip" style="margin:8px 0 0"></p>
  </div>`;
  const $=id=>document.getElementById(id);
  const lvl=()=>LEVELS.find(l=>l.id===R.level);
  function chrome(){
    $('rLevels').innerHTML=LEVELS.map(l=>`<button data-l="${l.id}" class="${l.id===R.level?'on':''}">${l.id}. ${l.name}</button>`).join('');
    document.querySelectorAll('#rMode button').forEach(b=>b.classList.toggle('on',b.dataset.m===R.mode));

    $('rKb').checked=!R.noKeys;const kb=document.querySelector('#rMode button[data-m="keys"]');kb.disabled=R.noKeys;
    $('rTip').textContent=lvl().tip;
  }
  function hud(){$('rHud').textContent=sess.a?`${Math.round(sess.c/sess.a*100)}% · ${sess.c}/${sess.a} · streak ${sess.streak} · ${(sess.time/sess.a/1000).toFixed(1)} s`:'';}
  function draw(reveal){
    $('rStaff').innerHTML=renderStaff({clefs:lvl().clefs,notes:cur?[{n:cur,color:reveal}]:[],letters:S.settings.aidLetters||hintUsed,colors:S.settings.aidColors});
  }
  function lightTarget(){if(!cur)return;const m=midiOf(cur);if(S.settings.aidKeyLight){ensureVisible(m);lightKeys([[m,'hint']]);}else lightKeys([]);}
  function answerUI(){

    if(R.mode==='names'){
      $('rAnswer').innerHTML=(hasAcc?`<div class="accrow" id="rAcc"><button data-a="-1">♭</button><button data-a="0" class="on">♮</button><button data-a="1">♯</button></div>`:'')+
        `<div class="answers" id="rNames">${LETTERS.map(l=>`<button data-l="${l}">${l}</button>`).join('')}</div>`;
      acc=0;
      if(hasAcc)$('rAcc').onclick=e=>{const b=e.target.closest('button');if(!b)return;acc=+b.dataset.a;document.querySelectorAll('#rAcc button').forEach(x=>x.classList.toggle('on',x===b));};
      $('rNames').onclick=e=>{const b=e.target.closest('button');if(!b||locked)return;judge(b.dataset.l===cur.l&&acc===cur.a,null);};
    }else if(R.mode==='keys'){
      $('rAnswer').innerHTML=`<p class="muted small" style="text-align:center;margin:6px 0">Play the note on the keyboard below${R.exactOct?' (exact octave)':''}.</p>`;
    }else{

      $('rReveal').onclick=()=>{if(locked)return;locked=true;const m=midiOf(cur);ensureVisible(m);lightKeys([[m,'show']]);playNotes([m]);
        $('rFb').className='feedback';$('rFb').textContent=nameOf(cur);draw('var(--accent)');
        $('rSelf').innerHTML=`<div class="grade"><button class="ok" data-g="1">Got it</button><button data-g="0.5">Shaky</button><button class="bad" data-g="0">Missed</button></div>`;
        $('rSelf').onclick=e=>{const b=e.target.closest('button');if(!b)return;const g=+b.dataset.g;tally(g);recordNote(cur,g,Date.now()-t0);next();};};
    }
  }
  KB.onPress=m=>{if(R.mode!=='keys'||locked||!cur)return;const t=midiOf(cur);const ok=R.exactOct?m===t:((m-t)%12+12)%12===0;judge(ok,m);};
  function tally(score){sess.a++;sess.c+=score;sess.time+=Date.now()-t0;sess.streak=score===1?sess.streak+1:0;hud();}
  function judge(ok,pressed){
    locked=true;const ms=Date.now()-t0;const m=midiOf(cur);tally(ok?1:0);recordNote(cur,ok?1:0,ms);
    const box=$('rStaff');box.classList.add(ok?'flash-ok':'flash-bad');
    $('rFb').className='feedback '+(ok?'ok':'bad');$('rFb').textContent=ok?'✓ '+nameOf(cur):`✗ It was ${nameOf(cur)}`;
    if(!ok){ensureVisible(m);const lit=[[m,'okk']];if(pressed!=null&&pressed!==m)lit.push([pressed,'badk']);lightKeys(lit);draw('var(--bad)');setTimeout(()=>playNotes([m]),pressed!=null?250:0);}
    else{if(pressed==null)playNotes([m]);draw('var(--ok)');}
    timer=setTimeout(next,ok?650:1700);
  }
  function next(){clearTimeout(timer);$('rStaff').classList.remove('flash-ok','flash-bad');hintUsed=false;
    prev=cur;cur=pickNote(lvl().pool(),prev);locked=false;t0=Date.now();
    if(R.mode==='keys'&&R.exactOct)ensureVisible(midiOf(cur));
    if(!['names','keys'].includes(R.mode)||true){$('rFb').textContent='';}

  $('rLevels').onclick=e=>{const b=e.target.closest('button');if(!b)return;R.level=+b.dataset.l;save();sess={a:0,c:0,streak:0,time:0};hud();chrome();next();
    const lv=lvl();KB.start=lv.clefs==='bass'?36:lv.clefs==='treble'?60:48;buildKeyboard();lightTarget();};
  $('rMode').onclick=e=>{const b=e.target.closest('button');if(!b)return;R.mode=b.dataset.m;save();chrome();next();};

  $('rHint').onclick=()=>{if(!cur||locked)return;hintUsed=true;draw();};

/* ================= Chord engine ================= */
// degree -> [letter steps above root, semitones above root]
const IV={'1':[0,0],'b2':[1,1],'2':[1,2],'#2':[1,3],'b3':[2,3],'3':[2,4],'4':[3,5],'#4':[3,6],'b5':[4,6],'5':[4,7],'#5':[4,8],'b6':[5,8],'6':[5,9],'bb7':[6,9],'b7':[6,10],'7':[6,11],
  'b9':[1,13],'9':[1,14],'#9':[1,15],'11':[3,17],'#11':[3,18],'b13':[5,20],'13':[5,21]};
const DEG_LABEL=d=>d==='1'?'root':d.replace('bb','𝄫').replace('b','♭').replace('#','♯')+({'1':'','2':'nd','3':'rd'}[d.slice(-1)]??'th');
const IV_NAME={'1':'unison','b2':'minor 2nd','2':'major 2nd','#2':'augmented 2nd','b3':'minor 3rd','3':'major 3rd','4':'perfect 4th','#4':'augmented 4th','b5':'diminished 5th','5':'perfect 5th',
  '#5':'augmented 5th','b6':'minor 6th','6':'major 6th','bb7':'diminished 7th','b7':'minor 7th','7':'major 7th'};
const QUALITIES=[
  {id:'maj',group:'Triads',name:'Major triad',f:['1','3','5'],sym:{std:'',jazz:'',cls:''},alt:['','M','maj'],desc:'Root + major 3rd + perfect 5th. Bright, stable.'},
  {id:'m',group:'Triads',name:'Minor triad',f:['1','b3','5'],sym:{std:'m',jazz:'−',cls:'min'},alt:['m','mi','min','−'],desc:'Lower the 3rd of a major triad by a half step.'},
  {id:'dim',group:'Triads',name:'Diminished triad',f:['1','b3','b5'],sym:{std:'dim',jazz:'°',cls:'dim'},alt:['dim','°'],desc:'Two stacked minor 3rds. Tense; found on the 7th degree of a major key.'},
  {id:'aug',group:'Triads',name:'Augmented triad',f:['1','3','#5'],sym:{std:'aug',jazz:'+',cls:'aug'},alt:['aug','+','(♯5)'],desc:'Two stacked major 3rds. Symmetrical — it divides the octave in three.'},
  {id:'sus2',group:'Triads',name:'Suspended 2nd',f:['1','2','5'],sym:{std:'sus2',jazz:'sus2',cls:'sus2'},alt:['sus2'],desc:'The 3rd is replaced by the 2nd: neither major nor minor.'},
  {id:'sus4',group:'Triads',name:'Suspended 4th',f:['1','4','5'],sym:{std:'sus4',jazz:'sus',cls:'sus4'},alt:['sus4','sus'],desc:'The 3rd is replaced by the 4th, which wants to fall back to the 3rd.'},
  {id:'6',group:'Sixths',name:'Major 6th',f:['1','3','5','6'],sym:{std:'6',jazz:'6',cls:'6'},alt:['6','add6'],desc:'Major triad + major 6th. A classic jazz “tonic” sound alongside maj7.'},
  {id:'m6',group:'Sixths',name:'Minor 6th',f:['1','b3','5','6'],sym:{std:'m6',jazz:'−6',cls:'min6'},alt:['m6','−6','mi6'],desc:'Minor triad + major 6th. Common minor tonic in jazz.'},
  {id:'7',group:'Sevenths',name:'Dominant 7th',f:['1','3','5','b7'],sym:{std:'7',jazz:'7',cls:'7'},alt:['7','dom7'],desc:'Major triad + minor 7th. The V chord: the 3rd and 7th form a tritone that pulls toward I (G7 → C).'},
  {id:'maj7',group:'Sevenths',name:'Major 7th',f:['1','3','5','7'],sym:{std:'maj7',jazz:'Δ7',cls:'M7'},alt:['maj7','Δ7','M7','Δ','ma7'],desc:'Major triad + major 7th. The I and IV chords in jazz.'},
  {id:'m7',group:'Sevenths',name:'Minor 7th',f:['1','b3','5','b7'],sym:{std:'m7',jazz:'−7',cls:'min7'},alt:['m7','−7','mi7','min7'],desc:'Minor triad + minor 7th. The ii chord in ii–V–I.'},
  {id:'m7b5',group:'Sevenths',name:'Half-diminished 7th',f:['1','b3','b5','b7'],sym:{std:'m7♭5',jazz:'ø7',cls:'m7♭5'},alt:['m7♭5','ø7','ø','−7♭5'],desc:'Diminished triad + minor 7th. The ii chord of a minor ii–V–i.'},
  {id:'dim7',group:'Sevenths',name:'Diminished 7th',f:['1','b3','b5','bb7'],sym:{std:'dim7',jazz:'°7',cls:'dim7'},alt:['dim7','°7'],desc:'Three stacked minor 3rds; the 7th is a double-flat (B𝄫 in C°7). Only 3 different ones exist.'},
  {id:'mMaj7',group:'Sevenths',name:'Minor-major 7th',f:['1','b3','5','7'],sym:{std:'m(maj7)',jazz:'−Δ7',cls:'mM7'},alt:['m(maj7)','−Δ7','mM7','m(Δ7)'],desc:'Minor triad + major 7th. Dark, cinematic minor tonic.'},
  {id:'7sus4',group:'Sevenths',name:'7 sus4',f:['1','4','5','b7'],sym:{std:'7sus4',jazz:'7sus',cls:'7sus4'},alt:['7sus4','7sus'],desc:'Dominant 7th with the 4th instead of the 3rd. Modal and open.'},
];
const QBY=Object.fromEntries(QUALITIES.map(q=>[q.id,q]));
const symStyle=()=>S.settings.symStyle||'std';
function rootPc(r){return((LETTER_PC[li(r)]+r.a)%12+12)%12;}
function spellChord(root,q,inv=0,oct=4){
  const rl=li(root);const rootMidi=12*(oct+1)+LETTER_PC[rl]+root.a;
  const notes=q.f.map(d=>{const[st,se]=IV[d];const l=LETTERS[(rl+st)%7];const nat=LETTER_PC[LETTERS.indexOf(l)];const midi=rootMidi+se;
    let a=((midi-nat)%12+12)%12;if(a>6)a-=12;return{n:N(l,a,Math.round((midi-nat-a)/12)-1),midi,deg:d};});
  for(let i=0;i<inv;i++){const x=notes.shift();x.midi+=12;x.n=N(x.n.l,x.n.a,x.n.oct+1);notes.push(x);}
  return notes;
}
function chordSymbol(root,q,bass,style){return nameOf(root,false)+q.sym[style||symStyle()]+(bass?'/'+nameOf(bass,false):'');}
const FIG={3:['','6','6/4'],4:['7','6/5','4/3','4/2']};
const INV_NAME=['Root position','1st inversion','2nd inversion','3rd inversion'];
const PC_NAMES=[['C'],['D♭','C♯'],['D'],['E♭','D♯'],['E'],['F'],['F♯','G♭'],['G'],['A♭','G♯'],['A'],['B♭','A♯'],['B','C♭']];
const rootFromName=s=>N(s[0],s.includes('♯')?1:s.includes('♭')?-1:0,4);
// best spelling of a root pc for a quality: fewest accidentals across the chord, then user preference
function bestRoot(pc,q){const opts=PC_NAMES[pc].map(rootFromName);if(opts.length===1)return opts[0];
  const score=r=>spellChord(r,q).reduce((a,x)=>a+Math.abs(x.n.a)*(Math.abs(x.n.a)>1?3:1),0);
  opts.sort((x,y)=>score(x)-score(y)||((S.settings.spelling==='flat')===(x.a<0)?-1:1));return opts[0];}
function recognizeChord(midis){
  const ms=[...new Set(midis)].sort((a,b)=>a-b);if(ms.length<2)return null;
  const pcs=[...new Set(ms.map(m=>m%12))];const bass=ms[0]%12;
  if(pcs.length===2&&ms.length===2){const d=ms[1]-ms[0];const names=['unison','minor 2nd','major 2nd','minor 3rd','major 3rd','perfect 4th','tritone','perfect 5th','minor 6th','major 6th','minor 7th','major 7th'];
    return{interval:(d%12===0?'octave':names[d%12])+(d>12?' + octave':'')};}
  const res=[];
  pcs.forEach(r=>QUALITIES.forEach((q,qi)=>{const set=q.f.map(d=>(r+IV[d][1])%12);
    if(set.length===pcs.length&&set.every(x=>pcs.includes(x)))res.push({r,q,qi,inRoot:r===bass});}));
  if(!res.length)return{unknown:true};
  res.sort((a,b)=>(b.inRoot-a.inRoot)||(a.qi-b.qi));
  return{matches:res.map(m=>{const root=bestRoot(m.r,m.q);const tones=spellChord(root,m.q);const bassTone=tones.find(t=>t.midi%12===bass);
    const spelled=ms.map(x=>{const t=tones.find(t=>t.midi%12===x%12);const n=t.n;return N(n.l,n.a,Math.round((x-LETTER_PC[li(n)]-n.a)/12)-1);});
    const invIdx=m.q.f.indexOf(bassTone.deg);
    return{root,q:m.q,bass:m.inRoot?null:bassTone.n,inv:invIdx,spelled,symbol:chordSymbol(root,m.q,m.inRoot?null:bassTone.n)};})};
}

/* ---------- KEY SIGNATURES ---------- */
const KEYSIGS=[ // [major, minor, count, type]
  ['C','A',0,'sharp'],['G','E',1,'sharp'],['D','B',2,'sharp'],['A','F♯',3,'sharp'],['E','C♯',4,'sharp'],['B','G♯',5,'sharp'],['F♯','D♯',6,'sharp'],['C♯','A♯',7,'sharp'],

const KS_LEVELS=[{id:1,name:'0–2 accidentals',max:2},{id:2,name:'0–4',max:4},{id:3,name:'All 15',max:7}];
function pcOfName(s){const l=s[0];let a=0;if(s.includes('♯'))a=1;if(s.includes('♭'))a=-1;return ((LETTER_PC[LETTERS.indexOf(l)]+a)%12+12)%12;}
function triad(root,minor){const r=60+pcOfName(root)-(pcOfName(root)>7?12:0);return[r,r+(minor?3:4),r+7];}
const ksKey=k=>k[0];
function viewKeys(){

  function quiz(){

  function circle(){
    const POS=[['C','a',0,'sharp'],['G','e',1,'sharp'],['D','b',2,'sharp'],['A','f♯',3,'sharp'],['E','c♯',4,'sharp'],[['B','C♭'],['g♯','a♭'],5,'sharp',7],
      [['F♯','G♭'],['d♯','e♭'],6,'sharp',6],[['D♭','C♯'],['b♭','a♯'],5,'flat',7],['A♭','f',4,'flat'],['E♭','c',3,'flat'],['B♭','g',2,'flat'],['F','d',1,'flat']];

      <div><div class="staffbox" id="cStaff"></div><div class="names" id="cName"></div></div></div>`;
    function info(i,a){const p=POS[i];const two=Array.isArray(p[0]);const maj=two?p[0][a]:p[0],min=two?p[1][a]:p[1];
      let count=p[2],type=p[3];if(two&&a===1){count=p[4];type=p[3]==='sharp'?'flat':'sharp';}
      if(two&&i===6&&a===1){count=6;type='flat';} if(two&&i===6&&a===0){count=6;type='sharp';}

      POS.forEach((p,i)=>{const ang=(i*30-90)*Math.PI/180;const two=Array.isArray(p[0]);const a=i===sel?alt:0;

        const x1=cx+R1*Math.cos(ang),y1=cy+R1*Math.sin(ang),x2=cx+R2*Math.cos(ang),y2=cy+R2*Math.sin(ang);

function viewProgress(){

  const weak=Object.entries(S.stats.notes).filter(([,v])=>v.a>=3).map(([k,v])=>({k,acc:v.c/v.a,a:v.a,t:v.t})).sort((a,b)=>a.acc-b.acc||b.t-a.t).slice(0,10);
  const ks=KEYSIGS.map(k=>{const s=S.stats.ks[ksKey(k)];const p=s&&s.a?Math.round(s.c/s.a*100):null;
    const bg=p==null?'var(--panel2)':`color-mix(in srgb, var(--ok) ${p}%, var(--bad))`;return `<div style="background:${bg};${p!=null?'color:#111':''}"><b>${k[0]}</b><br>${p==null?'—':p+'%'}</div>`;}).join('');
  const today=new Date().toDateString();const todayN=S.stats.log.filter(e=>new Date(e.d).toDateString()===today).length;
  main.innerHTML=`
  <div class="card"><h2>Note reading</h2><p class="small muted" style="margin-top:0">Answers today: ${todayN}. “Unaided” counts only answers with every aid off and no hint.</p>
    <table><tr><th>Level</th><th>Unaided</th><th>With aids</th></tr>${rows}</table></div>
  <div class="card"><h2>Weakest notes</h2>${weak.length?`<table><tr><th>Note</th><th>Accuracy</th><th>Avg time</th><th>Tries</th></tr>${weak.map(w=>`<tr><td>${esc(w.k.replace(':',' · '))}</td><td>${Math.round(w.acc*100)}%</td><td>${(w.t/1000).toFixed(1)} s</td><td>${w.a}</td></tr>`).join('')}</table>`:'<p class="muted small">Answer each note at least 3 times to see your weak spots here.</p>'}</div>
  <div class="card"><h2>Songs</h2>${songProgressRows()}</div>
  <div class="card"><h2>Key signatures (major)</h2><div class="ksgrid">${ks}</div></div>

    <div class="row" style="margin-bottom:6px"><button id="bSave" class="on">Save backup file</button><button id="bOpen">Open backup file</button></div>
    <div class="row"><button id="bCopy">Copy backup</button><button id="bShow" class="ghost">Show text</button><button id="bImport">Restore from pasted text</button><button id="bReset" class="bad">Reset progress</button></div>
    <textarea id="bText" placeholder="Paste backup JSON here" style="margin-top:8px"></textarea><div id="bMsg" class="small" style="margin-top:6px"></div></div>`;
  const $=id=>document.getElementById(id);const msg=(t,ok=true)=>{$('bMsg').textContent=t;$('bMsg').style.color=ok?'var(--ok)':'var(--bad)';};
  const dump=()=>JSON.stringify({app:'piano-trainer',v:1,exported:new Date().toISOString(),data:S});

  $('bSave').onclick=()=>{const ok=downloadFile(`piano-trainer-backup-${new Date().toISOString().slice(0,10)}.json`,dump(),'application/json');msg(ok?'Backup file saved (check Downloads / Files).':'Saving files is blocked here — use Copy backup.',ok);};

  $('sMode').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;stop();P.mode=b.dataset.m;save();clearHl();$('sFb').textContent='';$('sHud').textContent='';chrome();};
  $('sTempo').oninput=e=>{P.tempo=+e.target.value;save();$('sTempoV').textContent='♩ = '+Math.round(song.tempo*P.tempo);};
  $('sOpts').onclick=e=>{const b=e.target.closest('[data-o]');if(!b)return;const o=OPTS.find(x=>x[0]===b.dataset.o);o[3](!o[2]());
    if(P.noKeys&&P.mode==='wait'){stop();P.mode='step';}save();chrome();if(['letters','colors'].includes(o[0]))draw();if(o[0]==='kb'&&!P.noKeys)setTimeout(setRange,30);};
  let rt;const onResize=()=>{clearTimeout(rt);rt=setTimeout(draw,120);};window.addEventListener('resize',onResize);
  cleanup=()=>{stop();window.removeEventListener('resize',onResize);};
  chrome();setTimeout(()=>{draw();setRange();},0);
}

/* ---------- computer keyboard ---------- */
const KEYMAP={a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,k:12,o:13,l:14,p:15,';':16};
let kbOct=4;const downKeys=new Map();
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea,select'))return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='escape'){if(document.body.classList.contains('focus'))setFocus(false);return;}
  if(k===' '){e.preventDefault();const g=document.getElementById('sGo');if(g&&!e.repeat)g.click();return;}
  if(k==='n'){const n=document.getElementById('sNext');if(n)n.click();return;}
  if(k==='z'||k==='x'){kbOct=Math.max(1,Math.min(7,kbOct+(k==='z'?-1:1)));toast('Computer keys: C'+kbOct+' – E'+(kbOct+1));
    const lo=12*(kbOct+1);if(lo<KB.lo||lo+16>KB.hi){KB.start=lo;buildKeyboard();}return;}
  if(k in KEYMAP){e.preventDefault();if(e.repeat||downKeys.has(e.code))return;const m=12*(kbOct+1)+KEYMAP[k];downKeys.set(e.code,m);ensureAudio();KB.press(m);}
});
document.addEventListener('keyup',e=>{if(downKeys.has(e.code)){KB.release(downKeys.get(e.code));downKeys.delete(e.code);}});
window.addEventListener('blur',()=>{downKeys.forEach(m=>KB.release(m));downKeys.clear();});

/* ---------- install & updates ---------- */
let deferredInstall=null,swReg=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;
function installHint(){if(standalone())return'Installed ✓';const ua=navigator.userAgent;
  if(/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))return'Safari: Share button → “Add to Home Screen”.';
  if(/Android/.test(ua))return'Chrome menu ⋮ → “Install app” (or “Add to Home screen”).';
  if(/Firefox/.test(ua))return'Firefox can’t install web apps — open this page in Chromium, Chrome or Brave to install.';
  return'Chrome/Chromium/Brave: install icon in the address bar, or menu ⋮ → “Cast, save and share” → “Install page as app”.';}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;const b=document.getElementById('instBtn');if(b)b.style.display='';});
function showUpdate(reg){const b=document.getElementById('updBanner');b.classList.add('show');document.getElementById('updBtn').onclick=()=>{if(reg.waiting)reg.waiting.postMessage('SKIP_WAITING');else location.reload();};}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  navigator.serviceWorker.register('./sw.js').catch(()=>navigator.serviceWorker.getRegistration()).then(reg=>{if(!reg)return;swReg=reg;if(reg.waiting&&navigator.serviceWorker.controller)showUpdate(reg);
    reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpdate(reg);});});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{});});
  }).catch(()=>{});
  let refreshing=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshing)return;refreshing=true;location.reload();});
}

/* ---------- boot ---------- */
(async()=>{
  try{await IDB.open();const v=await IDB.get('state');if(v)S=merge(clone(DEFAULTS),v);else save();}catch(e){}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  setView(['play','read','chords','keys','songs','progress','settings'].includes(S.view)?S.view:'play');
})();
</script>
